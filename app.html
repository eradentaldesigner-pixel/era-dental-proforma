<!doctype html>
<html lang="tr">
<head>
<script>window.cfPdfRoute=new URLSearchParams(location.search).has("proforma");if(window.cfPdfRoute)document.documentElement.classList.add("cf-native-pdf-route");</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Era Dental — Teklif & Proforma Yönetimi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1e293b;--accent:#0284c7;--border:#cbd5e1;--bg-light:#f8fafc;--text-main:#0f172a;--text-muted:#475569}
*{box-sizing:border-box}body{margin:0;font-family:'Inter',Arial,sans-serif;background:#f3f5f7;color:var(--text-main)}
.top{background:#111827;color:white;padding:22px 34px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:800;letter-spacing:.4px}.brand span{color:#3b82f6}
.wrap{max-width:1380px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:460px 1fr;gap:24px}
.panel,.paper{background:white;border-radius:16px;box-shadow:0 8px 30px #0000000d}
.panel{padding:22px;position:sticky;top:20px;height:max-content}
.section{border-top:1px solid #e5e7eb;padding-top:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;color:#667085;display:block;margin:0 0 5px}
input,textarea,select{width:100%;border:1px solid #d9dee7;border-radius:9px;padding:10px 11px;font:inherit;background:#fff}
.items{margin-top:10px}.item{border:1px solid #e1e5eb;border-radius:10px;padding:12px;margin-bottom:10px}
.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}.blue{background:#2563eb;color:white}.light{background:#eef2f7;color:#111827}
.paper{padding:42px;min-height:900px}
.paper-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--primary,#111827);padding-bottom:18px}
.doc-title{font-size:22px;font-weight:800;color:var(--primary);margin:16px 0 0}
.paper-meta{text-align:right;min-width:210px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}
.box{border:1px solid #d9dee7;border-radius:10px;padding:14px}
.box h3{font-size:12px;text-transform:uppercase;margin:0 0 8px;color:#667085}
.box p{margin:3px 0;font-size:13px}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable th{background:#f1f3f5;text-align:left}
.ptable th,.ptable td{padding:9px;border:1px solid #d9dee7;vertical-align:top}
.right{text-align:right}
.totals{margin-left:auto;width:320px;margin-top:18px}
.totalrow{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.grand{border-top:2px solid var(--primary);font-weight:800;font-size:16px;padding-top:10px}
.notes{margin-top:18px;font-size:11px;line-height:1.6}
.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:35px}
.signature-box{min-height:85px;border:1px solid #e5e7eb;padding:12px 14px;border-radius:10px}
.signature-line{margin-top:40px;border-top:1px solid #17202a;padding-top:7px;text-align:center;font-size:11px;color:#667085}
.logo-preview{max-height:65px;max-width:190px;object-fit:contain;margin-bottom:10px;display:block}
.rate-box{margin:7px 0 3px;border:1px solid #d0d5dd;border-radius:7px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.rate-main{font-size:11.5px;font-weight:800}
.rate-meta{text-align:right;font-size:7.8px;color:#667085}
@media print{
  body{background:#fff}
  .top,.panel{display:none}
  .paper{box-shadow:none;border-radius:0;padding:6mm 8mm;margin:0}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">ERA<span>DENTAL</span> <span style="font-size:12px;color:#94a3b8;font-weight:400;">| Proforma & Teklif Yönetimi</span></div>
  <div>
    <button class="btn light" onclick="openArchive()">📁 Arşiv</button>
    <button class="btn light" onclick="openCatalog('manage')">📦 Katalog</button>
    <button class="btn light" onclick="openSettings()">⚙️ Ayarlar</button>
  </div>
</header>
<main class="wrap">
  <section class="panel">
    <h2>Belge ve Teklif Paneli</h2>
    <div class="grid">
      <div><label>Tarih</label><input id="date" type="date"></div>
      <div><label>Belge No</label><input id="no" readonly style="background:#f3f4f6;font-weight:700"></div>
    </div>
    <div class="section">
      <label>Alıcı / Müşteri Bilgileri</label>
      <div class="grid">
        <input class="full" id="buyerName" placeholder="Müşteri / Kurum Adı" autocomplete="off">
        <textarea class="full" id="buyerAddress" placeholder="Açık Adres"></textarea>
        <input id="buyerTaxOffice" placeholder="Vergi Dairesi">
        <input id="buyerTaxNo" placeholder="Vergi No">
        <input id="buyerPhone" placeholder="Telefon">
        <input id="buyerEmail" placeholder="E-posta">
      </div>
    </div>
    <div class="section">
      <label>Ürün ve Hizmetler</label>
      <div class="actions" style="margin:10px 0;display:flex;gap:8px;">
        <button type="button" class="btn primary" onclick="openCatalog('select')">📦 Katalogdan Ürün Seç</button>
        <button type="button" class="btn light" onclick="addItem()">+ Manuel Ürün</button>
      </div>
      <div id="items" class="items"></div>
    </div>
    <div class="section">
      <div class="grid">
        <div><label>Kur (TCMB Efektif Satış)</label><input id="rate" type="number" step="0.0001"></div>
        <div>
          <label>Para Birimi</label>
          <select id="currency" onchange="render()">
            <option value="EUR">EUR (€)</option>
            <option value="USD">USD ($)</option>
            <option value="TRY">TRY (₺)</option>
          </select>
        </div>
        <div>
          <label>Belge Türü</label>
          <select id="docType" onchange="render()">
            <option value="proforma">Proforma Fatura</option>
            <option value="teklif">Fiyat Teklifi</option>
          </select>
        </div>
        <div><label id="validityLabel">Ödeme Vade / Geçerlilik</label><input id="validityDays" value="10.10.2026"></div>
        <div class="full"><label>Ödeme Şekli / Şartları</label><input id="payment" placeholder="Örn: Havale / EFT, Kredi Kartı"></div>
        <div class="full"><label>Teklif Sorumlusu / Temsilci</label><input id="bidder" placeholder="Örn: Burak Yavuz"></div>
      </div>
    </div>
    <div class="actions" style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn primary" onclick="saveProformaAndPdf()">☁ Kaydet ve Yazdır</button>
      <button class="btn light" onclick="resetForm()">Temizle</button>
    </div>
  </section>
  <div class="paper-scroll">
    <section class="paper" id="paper"></section>
  </div>
</main>

<script>
// Temel Veri ve Durum Yönetimi
let itemsData = [];
let companySettings = {
  name: "Era Medikal ve Dental İth. İhr. Paz. Ltd. Şti.",
  address: "Beşyol Mah. Fabrikalar Cad. Ortadoğu Gazete Binası Kat:1 D:4 Florya / İSTANBUL",
  phone: "0212 240 61 22",
  email: "info@eradental.com",
  website: "www.eradental.com",
  taxOffice: "Küçükçekmece",
  taxNo: "3360000000",
  slogan: "Dijital diş hekimliğinde daha yenilikçi yarınlar için.",
  solutionsTitle: "ÇÖZÜMLERİMİZ",
  solutions: ["3D Yazıcı & Tarayıcı", "CAD/CAM Sistemleri", "Porselen & Sinter Fırını", "Lab Ekipmanları", "Dental Sarf & Makyaj"]
};

document.getElementById('date').valueAsDate = new Date();
document.getElementById('no').value = "PRF-2026-0001";

function render() {
  const isProforma = document.getElementById('docType').value === 'proforma';
  const docTitleText = isProforma ? "PROFORMA FATURA" : "TEKLİF FORMU";
  const rightBoxTitle = isProforma ? "PROFORMA BİLGİLERİ" : "TEKLİF BİLGİLERİ";
  const docNoLabel = isProforma ? "Proforma No" : "Teklif No";
  const validityLabelText = isProforma ? "Ödeme Vade Tarihi" : "Geçerlilik Süresi";

  const buyerName = document.getElementById('buyerName').value || "Müşteri / Kurum Adı Bekleniyor...";
  const buyerAddress = document.getElementById('buyerAddress').value || "Adres bilgisi girilmedi.";
  const buyerTaxOffice = document.getElementById('buyerTaxOffice').value || "-";
  const buyerTaxNo = document.getElementById('buyerTaxNo').value || "-";
  const buyerPhone = document.getElementById('buyerPhone').value || "-";
  const buyerEmail = document.getElementById('buyerEmail').value || "-";
  const currency = document.getElementById('currency').value;
  const rate = parseFloat(document.getElementById('rate').value) || 49.2898;
  const payment = document.getElementById('payment').value || "Havale / EFT";
  const bidder = document.getElementById('bidder').value || "Burak Yavuz";
  const docDate = document.getElementById('date').value || "14.10.2026";
  const docNo = document.getElementById('no').value;

  let html = `
    <div class="paper-head">
      <div>
        <div style="font-size:24px; font-weight:800; color:var(--primary);">ERA<span>DENTAL</span></div>
        <div style="font-size:9.5px; color:var(--text-muted); margin-top:2px;">${companySettings.slogan}</div>
        <div style="font-size:9.5px; color:var(--text-muted); margin-top:8px; line-height:1.4;">
          <strong>${companySettings.name}</strong><br>
          ${companySettings.address}<br>
          Tel: ${companySettings.phone} | E-posta: ${companySettings.email}
        </div>
      </div>
      <div class="paper-meta">
        <div style="background:var(--primary); color:#fff; padding:6px 14px; border-radius:6px; font-weight:800; font-size:12px; display:inline-block; margin-bottom:8px;">${docTitleText}</div>
        <div style="font-size:11px; line-height:1.5;">
          <strong>Tarih:</strong> ${docDate}<br>
          <strong>${docNoLabel}:</strong> ${docNo}<br>
          <strong>${validityLabelText}:</strong> ${document.getElementById('validityDays').value || '24.10.2026'}<br>
          <strong>Ödeme Şekli:</strong> ${payment}
        </div>
      </div>
    </div>

    <div class="boxes">
      <div class="box">
        <h3>MÜŞTERİ BİLGİLERİ</h3>
        <p><strong>${buyerName}</strong></p>
        <p>${buyerAddress}</p>
        <p>Tel: ${buyerPhone} | E-posta: ${buyerEmail}</p>
        <p>Vergi Dairesi/No: ${buyerTaxOffice} / ${buyerTaxNo}</p>
      </div>
      <div class="box">
        <h3>${rightBoxTitle}</h3>
        <p><strong>Para Birimi:</strong> ${currency}</p>
        <p><strong>Satış Temsilcisi:</strong> ${bidder}</p>
        <div class="rate-box">
          <div class="rate-main">TCMB Kur: 1 ${currency} = ${rate.toFixed(4)} TL</div>
        </div>
      </div>
    </div>

    <table class="ptable">
      <thead>
        <tr>
          <th style="width:35px;" class="right">No</th>
          <th style="width:110px;">Ürün Kodu</th>
          <th>Ürün Adı / Açıklama</th>
          <th style="width:55px;" class="right">Miktar</th>
          <th style="width:55px;">Birim</th>
          <th style="width:95px;" class="right">Birim Fiyat (${currency})</th>
          <th style="width:95px;" class="right">Tutar (${currency})</th>
        </tr>
      </thead>
      <tbody>
  `;

  let subtotal = 12500.00; // Örnek hesaplama
  html += `
        <tr>
          <td class="right">1</td>
          <td><strong>SHN-AS3-01</strong></td>
          <td>Shining 3D Aoralscan 3 İntraoral Ağız İçi Tarayıcı</td>
          <td class="right">1</td>
          <td>Adet</td>
          <td class="right">12.500,00</td>
          <td class="right">12.500,00</td>
        </tr>
      </tbody>
    </table>

    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-top:20px;">
      <div style="width:55%;">
        ${isProforma ? `
          <div class="box" style="margin-bottom:10px;">
            <h3>FATURAYI DÜZENLEYEN FİRMA</h3>
            <p><strong>${companySettings.name}</strong></p>
            <p>Vergi Dairesi: ${companySettings.taxOffice} \vert{} VKN:${companySettings.taxNo}</p>
          </div>
          <div class="box">
            <h3>ÖDEME BİLGİLERİ (IBAN)</h3>
            <p><strong>Garanti BBVA (${currency}):</strong> TR00 0006 2000 0000 0000 0000 00</p>
          </div>
        ` : `
          <div class="box">
            <h3>AÇIKLAMALAR / KOŞULLAR</h3>
            <p class="notes">1. Cihazlar üretim hatalarına karşı 2 yıl Era Dental garantisi altındadır.<br>2. Kurulum ve kullanıcı eğitimi teknik ekibimizce ücretsiz gerçekleştirilir.</p>
          </div>
        `}
      </div>

      <div class="totals">
        <div class="totalrow"><span>Ara Toplam</span><span>12.500,00 ${currency}</span></div>
        <div class="totalrow"><span>KDV (%20)</span><span>2.500,00 ${currency}</span></div>
        <div class="totalrow grand"><span>Genel Toplam</span><span>15.000,00 ${currency}</span></div>
        <div class="totalrow" style="color:#0284c7; font-weight:700;"><span>TL Karşılığı</span><span>739.347,00 TL</span></div>
      </div>
    </div>

    <div class="signature-grid">
      <div class="signature-box">
        <div style="font-size:11px; font-weight:700;">ERA DENTAL (Resmi Kaşe / Yetkili İmza)</div>
        <div class="signature-line">Era Medikal ve Dental Ltd. Şti.</div>
      </div>
      <div class="signature-box">
        <div style="font-size:11px; font-weight:700;">MÜŞTERİ ONAYI (Kaşe / İmza)</div>
        <div class="signature-line">İşbu teklif şartları kabul edilmiştir.</div>
      </div>
    </div>
  `;

  document.getElementById('paper').innerHTML = html;
}

function addItem() { alert("Ürün satırı eklendi."); }
function openArchive() { alert("Arşiv paneli açılıyor."); }
function openCatalog() { alert("Katalog paneli açılıyor."); }
function openSettings() { alert("Ayarlar paneli açılıyor."); }
function resetForm() { document.getElementById('buyerName').value = ""; render(); }
function saveProformaAndPdf() { window.print(); }

window.onload = () => { render(); };
</script>
</body>
</html>
